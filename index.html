<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Pokemon BGM</title>
        <link rel="stylesheet" href="css/base.css">
        <link rel="stylesheet" href="css/gene-screen.css">
        <link rel="stylesheet" href="css/list-screen.css">
        <link rel="stylesheet" href="css/player-screen.css">
        <link rel="stylesheet" href="css/miniplayer-screen.css">
        <link rel="icon" href="data:,">
        <script src="https://unpkg.com/lucide@latest"></script><!--ボタン用のライブラリ読み込み-->
    </head>
    <body>
        <!--エラー表示-->
        <div id ="error-area" class="error"></div>

        <!--1枚目のスクリーン-->
        <div id="gene-screen" class="screen gene-screen">
            <div id="gene-list" class="gene-list">
            </div>
            <div class="player-container">
                <div class="controls">
                    <button class="btn" onclick="geneMoveCursor(-1)">
                        <i data-lucide="chevron-up"></i>
                    </button>
                    <button class="btn" onclick="decideGene()">
                        <i data-lucide="check"></i>
                    </button>
                    <button class="btn" onclick="geneMoveCursor(1)">
                        <i data-lucide="chevron-down"></i>
                    </button>
                </div>
            </div>
        </div>

        <!--2枚目のスクリーン-->
        <div id="list-screen" class="screen list-screen hidden">
            <button class="btn-back" onclick="closeList()">▼ メニューに戻る</button>
            <div class="gen-header">
                <img id="selected-gen-jacket" src="" alt="Generation" onerror="this.style.display='none'">
            </div>
            
            <div id="song-list" class="song-list">
                <div ud="song-item" class="song-item">
                </div>
                
            </div>
            <div class="player-container">
                <div class="controls">
                    <button class="btn" onclick="moveCursor(-1)">
                        <i data-lucide="chevron-up"></i>
                    </button>
                    <button class="btn" onclick="decideSong()">
                        <i data-lucide="play"></i>
                    </button>
                    <button class="btn" onclick="moveCursor(1)">
                        <i data-lucide="chevron-down"></i>
                    </button>
                </div>
            </div>
        </div>

        <!--3枚目のスクリーン-->
        <div id="player-screen" class="screen player-screen hidden">
            <button class="btn-back" onclick="closePlayer()">▼ リストに戻る</button><!--戻る時に光らせてない-->
            <div class="now-playing">
                <img id="jacket-img" class="player-main-jacket" src=""><!--currentSongもないので，一旦空っぽ-->
                <h2 id="current-title" class="player-title" text="">曲名</h2>
                <div class="seek-bar-container">
                    <input type="range" id="seek-bar" value="0" step="0.1" oninput="seek(this.value)">
                </div>
            </div>
            <div class="player-container">
                <div class="controls">
                    <button class="btn" onclick="skip(-10)">
                        <i data-lucide="skip-back"></i>
                    </button>
                    <button class="btn" id="play-pause-btn" onclick="togglePlay()">
                        <i data-lucide="play" class="icon-play"></i>
                        <i data-lucide="pause" class="icon-pause" style="display: none;"></i>
                    </button>
                    <button class="btn" onclick="skip(10)">
                        <i data-lucide="skip-forward"></i>
                    </button>
                    <button class="btn" id="loop-btn" onclick="toggleLoop()">
                        <i data-lucide="repeat"></i>
                    </button>
                </div>
            </div>            
        </div>

        <!--4枚目のミニスクリーン-->
        <div id="miniplayer" class="miniplayer hidden">
            <img id="mini-img" class="mini-jacket" src="" onerror="this.style.display='none'">
        </div>
        <script src="js/lucide.min.js"></script>
        <script src="js/script.js"></script>
    </body>
</html>
